<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flashcard App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="auth" class="auth-box">

    <h2>Login</h2>
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>


    <h2>Register</h2>
    <input id="regUsername" placeholder="Username">
    <input id="regEmail" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">
    <button id="registerBtn">Register</button>

  </div>

  <div id="app" class="container" style="display:none;">
<div id="adminPanel" style="display:none; margin-top:20px;">
  <h2>Admin Panel</h2>

  <button id="loadUsersBtn">View Users</button>
  <button id="loadHistoryBtn">View All Flashcards</button>

  <div id="adminOutput"></div>
</div>
    <h1>Flashcard Learning App</h1>

    <div class="mode-switch">
      <button id="manageBtn" class="active-mode">Manage</button>
      <button id="studyBtn">Study</button>
      <button id="adminBtn">Admin</button>
    </div>

    <div id="progress" class="progress"></div>

    <div class="form">
      <input id="question" placeholder="Enter question">
      <input id="answer" placeholder="Enter answer">
      <button id="addBtn">Add Flashcard</button>
    </div>

    <div id="cards" class="cards"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
