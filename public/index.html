<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flashcard Learning App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Flashcard Learning App</h1>

    <div class="mode-switch">
      <button id="manageBtn" class="active-mode">Manage</button>
      <button id="studyBtn">Study</button>
    </div>

    <div id="progress" class="progress"></div>

    <div class="form">
      <input id="question" placeholder="Enter question">
      <input id="answer" placeholder="Enter answer">
      <button id="addBtn">Add Flashcard</button>
    </div>

    <div id="cards" class="cards"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
